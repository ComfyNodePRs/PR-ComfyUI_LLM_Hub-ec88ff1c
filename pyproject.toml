[project]
name = "llm_hub"
description = "Utilize the power of an LLM into ComfyUI to transform your text-to-image and text-to-video ideas into highly detailed prompts for generation while giving you full control."
version = "1.0.0"
license = {file = "LICENSE"} 
# classifiers = [
#     # For OS-independent nodes (works on all operating systems)
#     "Operating System :: OS Independent",
#
#     # OR for OS-specific nodes, specify the supported systems:
#     "Operating System :: Microsoft :: Windows",  # Windows specific
#     "Operating System :: POSIX :: Linux",  # Linux specific
#     "Operating System :: MacOS",  # macOS specific
#
#     # GPU Accelerator support. Pick the ones that are supported by your extension.
#     "Environment :: GPU :: NVIDIA CUDA",    # NVIDIA CUDA support
#     "Environment :: GPU :: AMD ROCm",       # AMD ROCm support
#     "Environment :: GPU :: Intel Arc",      # Intel Arc support
#     "Environment :: NPU :: Huawei Ascend",  # Huawei Ascend support
#     "Environment :: GPU :: Apple Metal",    # Apple Metal support
# ]

dependencies = ["transformers", "torch", "accelerate", "bitsandbytes", "llama-cpp-python --config-settings=cmake.args=\"-DGGML_CUDA=on\""]

[project.urls]
Repository = "https://github.com/claptrap0/ComfyUI_LLM_Hub"
#  Used by Comfy Registry https://registry.comfy.org
Documentation = "https://github.com/claptrap0/ComfyUI_LLM_Hub?tab=readme-ov-file#-llm-hub"
"Bug Tracker" = "https://github.com/claptrap0/ComfyUI_LLM_Hub/issues"

[tool.comfy]
PublisherId = "claptrap"
DisplayName = "ComfyUI_LLM_Hub"
Icon = ""
includes = [] 
